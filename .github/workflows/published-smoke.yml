name: Published eino-viewer smoke

on:
  workflow_call:
    inputs:
      version:
        description: Exact eino-viewer npm version to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact eino-viewer npm version to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  consumer:
    name: Published eino-viewer consumer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: node --check scripts/check-published-eino-viewer.js
      - name: Install and build the published package
        run: node scripts/check-published-eino-viewer.js "${{ inputs.version }}"
