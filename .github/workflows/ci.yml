name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: Package / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run prepublishOnly
      - if: matrix.node == 24
        run: node scripts/check-eino-viewer-release.js

  go:
    name: Go / Eino ${{ matrix.eino }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        eino: [v0.9.0, v0.9.19]
    defaults:
      run:
        working-directory: integrations/go
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.18.x
          cache-dependency-path: integrations/go/go.sum
      - run: go mod edit -require=github.com/cloudwego/eino@${{ matrix.eino }}
      - run: go mod tidy
      - run: go test ./...
      - run: go vet ./...

  browser:
    name: Browser / Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser -- --project=chromium
