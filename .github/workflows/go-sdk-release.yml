name: Go SDK release

on:
  push:
    tags: ['integrations/go/v*']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: integrations/go/go.sum
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: go test ./... && go vet ./... && go test -race ./...
        working-directory: integrations/go
      - run: npm run test:protocol-v2:all
      - name: Verify module path and tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(cd integrations/go && go list -m)" = github.com/silicon-nora/eino-viewer/integrations/go
          case "$RELEASE_TAG" in integrations/go/v0.*|integrations/go/v1.*) ;; *) exit 1 ;; esac
